services:
  workspace:
    image: mcr.microsoft.com/devcontainers/dotnet:2.0.6-10.0-noble
    working_dir: /project/workspace
    volumes:
      # Mount the workspace root
      - ${HOME}/projects/source/github/{{cookiecutter.workspace_owner}}/{{cookiecutter.ws_repository}}:/project/workspace
      # Mount each source repo
      - ${HOME}/projects/source/github/{{cookiecutter.source_owner}}/{{cookiecutter.source_repo}}:/project/source/{{cookiecutter.source_repo}}
      # Mount SSH keys for git push access to GitHub
      - ${HOME}/.ssh:/home/vscode/.ssh:ro
      # Mount only Claude Code credentials so the container reuses host auth
      # without overriding container-local settings/commands created by install.sh
      - ${HOME}/.claude/.credentials.json:/home/vscode/.claude/.credentials.json
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NODE_ENV: DEVELOPMENT
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Search Path=${DB_SCHEMA}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 5000:5000
      - 5001:5001
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
